namespace:
  name: sandbox
service:
  port: 4111
  targetPort: 3111
  protocol: TCP
  type: ClusterIP
image:
  repository: ax719/techtrends
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 1
Resources:
  requests:
    cpu: "250m"
    memory: "640Mi"
  limits:
    cpu: "500m"
    memory: "128Mi"
containerPort: 3111
livenessProbe:
  path: /healthz
readinessProbe:
  path: /healthz
    