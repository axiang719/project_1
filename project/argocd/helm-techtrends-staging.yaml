apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techtrends-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/axiang719/project_1.git"
    path: project/helm
    targetRevision: main
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: "https://kubernetes.default.svc"  
    namespace: staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true  